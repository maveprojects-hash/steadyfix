name: CMMS quality checks

on:
  pull_request:
    paths:
      - "maintdesk_app.html"
      - "maintdesk_login.html"
      - "industry_workspaces.js"
      - "communication.js"
      - "communication.css"
      - "supabase/migrations/**"
      - "supabase/functions/smart-endpoint/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/cmms-quality.yml"
  push:
    paths:
      - "maintdesk_app.html"
      - "maintdesk_login.html"
      - "industry_workspaces.js"
      - "communication.js"
      - "communication.css"
      - "supabase/migrations/**"
      - "supabase/functions/smart-endpoint/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/cmms-quality.yml"

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmms_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CMMS JavaScript and notification safeguards
        run: python3 tests/check_cmms.py
      - name: Run transactional quote conversion PostgreSQL regression
        run: bash tests/test_quote_conversion_rpc.sh
      - name: Run concurrent stock adjustment PostgreSQL regression
        run: bash tests/test_stock_adjustment_rpc.sh

      - name: Install browser QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for document output tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive preview, PDF download and native-share browser tests
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Check purchase order line integrity guards
        run: python3 tests/check_purchase_order_line_integrity.py
      - name: Check work order numeric integrity guards
        run: python3 tests/check_work_order_numeric_integrity.py
