  const curl=`curl -X POST ${URL_} -H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json" -d '{"p_key":"${s.device_key}","p_value":${net?1:23.5}}'`;
  const lim=(s.alert_min!=null?' · alert below '+s.alert_min:'')+(s.alert_max!=null?' · alert above '+s.alert_max:'');
  return`<div class="card"><div class="ct"><div>${k[0]} ${esc(s.name)}</div><div class="chips">${stt}</div></div><div style="font-size:26px;font-weight:700;margin-top:6px" class="${alert||offl?'bad':''}">${esc(disp)}</div><div class="note" style="margin:2px 0">${esc(k[1])} · ${last?'last seen '+ago(mins):'waiting for first reading'}${lim}</div>${spark(h.slice(0,40).reverse().map(x=>+x.value),s.alert_min!=null?+s.alert_min:null,s.alert_max!=null?+s.alert_max:null)}
<details class="noprint" style="margin-top:8px"><summary style="cursor:pointer;color:var(--ac);font-weight:600">Connect this device</summary><div class="note">Any device or system that can send a web request can report here. Test it from a computer with:</div><pre style="white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:8px;font-size:12px" id="cu${s.id}">${esc(curl)}</pre><button class="b" onclick="copyTxt('cu${s.id}')">Copy</button><div class="note">Device key: <b>${s.device_key}</b>. Keep it private.</div></details>

 SHARE={title:'Monitoring status - '+SH(),text:'Monitoring status\n'+SH()+' · '+new Date().toLocaleString('en-ZA')+'\nOnline: '+on+' · Offline: '+off+' · Alerts: '+al+'\n\n'+(txt.join('\n')||'No devices yet')};
 const add=`<details class="p noprint"><summary>＋ Add device</summary><div class="f" style="margin-top:10px"><input id="sn" placeholder="Name, e.g. Main router or Geyser block C"><select id="sk">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}</select><input id="su" placeholder="Unit (optional)"><input id="smin" type="number" placeholder="Alert below"><input id="smax" type="number" placeholder="Alert above"><button onclick="addS()">Add</button></div><div class="note">For Wi-Fi, router and phone-system checks leave the alert fields empty; the app raises an alert when the device reports down.</div></details>`;
 const help=`<details class="p noprint"><summary>How to connect devices, Wi-Fi and phones</summary><div class="note"><b>Smart meters, sensors and controllers:</b> anything that can send a web request (ESP32 or Arduino boards, Shelly Gen2 and Pro units, Home Assistant, Node-RED, Zabbix or PRTG scripts) posts a number to the address shown under “Connect this device”. Devices without that ability, such as Tuya or Sonoff units, report through Home Assistant.<br><br><b>Wi-Fi network, routers, access points and the phone system:</b> run the STEADYFIX gateway script on any PC or Raspberry Pi that stays on in the building. It scans the network for devices, checks the equipment you choose every minute, and reports up or down here.<br><br><b>Updates:</b> device firmware is updated in each device's own app. The gateway script is updated by replacing the file with the new version.</div></details>`;

async function addS(){const n=$('sn').value.trim();if(!n)return alert('Type a name first.');const k=$('sk').value,r={company_id:me.company_id,site_id:site,name:n,kind:k,unit:$('su').value||null,alert_min:$('smin').value===''?null:+$('smin').value,alert_max:$('smax').value===''?null:+$('smax').value};

 const{data,error}=await sb.from(id).insert(row).select('id').single();if(error)return alert(error.message);
 if(id=='stock_items')await sb.from('stock_levels').upsert({item_id:data.id,site_id:site,company_id:me.company_id,on_hand:oh});draw()}

const STARTER={daily:['Walk-round: leaks, noises, alarms','Pool plant pressure & chlorine','Generator fuel & battery','Geyser valves','Log meter readings'],weekly:['Test emergency lighting','Grease pumps & motors','Inspect gas connections','Clean strainers & filters','Fleet tyre & oil check'],monthly:['Thermal scan DB boards','Test generator on load','Service booster pumps','Review stock vs min levels','Review overdue PMs'],yearly:['Fire equipment service check','Electrical compliance inspection','Gas safety inspection','Boiler and geyser inspection','Review asset replacement plan']};
const FRQ=['daily','weekly','monthly','yearly'];let ct=null,ced=false,MP=Promise.resolve();
function pk(f){const d=new Date(),z=n=>String(n).padStart(2,'0');if(f=='weekly')d.setDate(d.getDate()-((d.getDay()+6)%7));if(f=='monthly')d.setDate(1);if(f=='yearly'){d.setMonth(0);d.setDate(1)}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
async function chk(){
 const all=(await sb.from('checklist_templates').select('*').eq('site_id',site).order('name')).data||[],list=all.filter(x=>x.frequency==cf),t=list.find(x=>x.id==ct)||list[0];
 const head=`<h2>Checklists</h2><div class="tabs noprint">${FRQ.map(c=>`<button class="${c==cf?'on':''}" onclick="cf='${c}';ct=null;ced=false;draw()">${cap(c)}</button>`).join('')}</div>`;
 const newf=`<details class="p noprint"><summary>＋ New ${cf} checklist</summary><div class="f" style="margin-top:10px"><input id="ncn" placeholder="Name, e.g. Kitchen opening check"><button onclick="newList()">Create</button></div></details>`;
 if(!t)return head+`<div class="p noprint">No ${cf} checklist yet. Create your own below${all.length?'.':', or add starter lists for every frequency.'}</div>${all.length?'':`<button class="b noprint" onclick="seed()">Add starter lists</button><br><br>`}${newf}`;
 ct=t.id;const key=pk(cf),run=(await sb.from('checklist_runs').select('results').eq('template_id',t.id).eq('run_date',key).maybeSingle()).data,res=run?.results||{},meta=res._meta||{},by=meta.by??me.full_name;
 SHARE={title:t.name+' - '+SH(),text:t.name+' ('+cap(cf)+' checklist)\n'+(LS('sf_label')||CO)+' · '+SH()+' · '+dd(key)+'\nChecked by: '+(by||'-')+'\n\n'+t.items.map((x,i)=>(res[i]?'[x] ':'[ ] ')+x).join('\n')+(meta.notes?'\n\nNotes: '+meta.notes:'')+'\n\nSigned off by: '+(meta.mgr||'-')+(meta.date?' on '+dd(meta.date):'')};
 const mt=f=>`onchange="meta('${t.id}','${key}','${f}',this.value)"`;
 const sel=list.length>1?`<div class="f noprint"><select onchange="ct=this.value;ced=false;draw()">${list.map(x=>`<option value="${x.id}" ${x.id==t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:'';
 const body=ced?`<div class="p noprint"><b>Edit this checklist</b><label class="el">List name<input value="${esc(t.name)}" onchange="renList('${t.id}',this.value)"></label>${t.items.map((x,i)=>`<div class="f" style="margin:8px 0 0"><input value="${esc(x)}" onchange="editTask('${t.id}',${i},this.value)"><button class="x" onclick="delTask('${t.id}',${i})">✕</button></div>`).join('')}<div class="f" style="margin-top:10px"><input id="nt" placeholder="New task"><button onclick="addTask('${t.id}')">Add task</button></div><button class="b" onclick="ced=false;draw()">Done editing</button> <button class="x2" style="padding:8px 12px;background:none;border:1px solid var(--bad);color:var(--bad);border-radius:3px;cursor:pointer" onclick="delList('${t.id}')">Delete this checklist</button></div>`
 :`<div class="p noprint">${t.items.map((x,i)=>`<label class="chk"><input type="checkbox" ${res[i]?'checked':''} onchange="tick('${t.id}','${key}',${i},this.checked)"><span class="${res[i]?'done':''}">${esc(x)}</span></label>`).join('')||'<div class="rl">No tasks yet. Tap Edit tasks to add some.</div>'}<div style="margin-top:8px"><b>${t.items.filter((x,i)=>res[i]).length} of ${t.items.length} done</b> · ${esc(t.name)} · ${dd(key)}</div></div>
 <div class="p noprint"><b>Sign-off</b><label class="el">Checked by (staff member)<input value="${esc(by)}" ${mt('by')}></label><label class="el">Signed off by (manager)<input value="${esc(meta.mgr||'')}" ${mt('mgr')}></label><label class="el">Sign-off date<input type="date" value="${esc(meta.date||'')}" ${mt('date')}></label><label class="el">Notes or issues found<textarea ${mt('notes')}>${esc(meta.notes||'')}</textarea></label></div>`;
 const sheet=`<div class="po"><br><p><b>${esc(t.name)}</b> · ${cap(cf)} checklist · ${dd(key)}</p><p>Checked by: ${esc(by||'______________________')}</p><table class="pt"><tr><th style="width:60px">Done</th><th>Task</th></tr>${t.items.map((x,i)=>`<tr><td>${res[i]?'☑':'☐'}</td><td>${esc(x)}</td></tr>`).join('')}</table><p><b>Notes or issues found:</b> ${meta.notes?esc(meta.notes):'<br><br>______________________________________________'}</p></div>${foot(by,meta.mgr,meta.date)}`;
 return head+sel+`${ph(t.name+' ('+cap(cf)+' checklist)')}`+bar()+(ced?'':`<div class="noprint" style="margin-bottom:10px"><button class="b" onclick="ced=true;draw()">Edit tasks</button> ${newf?'':''}</div>`)+body+sheet+(ced?'':newf)}
async function seed(){await sb.from('checklist_templates').insert(Object.entries(STARTER).map(([f,items])=>({company_id:me.company_id,site_id:site,name:cap(f)+' checks',frequency:f,items})));draw()}
