<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steadyfix CMMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e8eaed;--pn:#fff;--ink:#1b2831;--mut:#5d6b75;--ln:#cfd5da;--ac:#1f5f8b;--am:#e59f0f;--ok:#2e7d4f;--bad:#c23b2a;--nav:#1b2831}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{background:var(--nav);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:22px;flex:1}header a{color:var(--am);font-size:14px}
header select{background:#2c3b45;color:#fff;border:0;padding:6px;border-radius:3px}
nav{background:var(--nav);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:#c9d3da;padding:11px 12px;font:500 14px system-ui;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--am)}
main{max-width:1100px;margin:0 auto;padding:14px}h2{margin:0 0 10px;font-size:22px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
.k{background:var(--pn);border-left:5px solid var(--ac);padding:10px}.k b{font-size:28px;display:block}.k span{color:var(--mut);font-size:13px}
.p{background:var(--pn);padding:12px;margin-bottom:14px;border:1px solid var(--ln)}
.sc{overflow-x:auto;background:var(--pn)}table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left}th{font-size:13px;color:var(--mut);background:var(--bg)}
td input,td select{width:100%;border:1px solid transparent;background:none;font:inherit;padding:5px;color:var(--ink)}
td input:focus,td select:focus{border-color:var(--ac);background:#fff}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.f input,.f select,.f button{flex:1 1 130px;padding:8px;font:inherit;border:1px solid var(--ln);border-radius:3px;min-width:0}
.f button,.b{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;cursor:pointer;flex:0 0 auto}
.b{padding:8px 12px;border:0;border-radius:3px}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
.chk{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ln);align-items:center}.chk input{width:20px;height:20px}
.done{text-decoration:line-through;color:var(--mut)}.note{color:var(--mut);font-size:13px;margin:6px 0 12px}
.bad{color:var(--bad);font-weight:600}.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border:1px solid var(--ln);background:var(--pn);cursor:pointer}.tabs .on{background:var(--ac);color:#fff}

.bar2{display:flex;gap:8px;margin:0 0 12px}.bar2 button{flex:1;padding:9px 6px;border:1px solid var(--ac);background:var(--pn);color:var(--ac);font:600 14px system-ui;border-radius:4px;cursor:pointer}
.card{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--ac);padding:12px;margin-bottom:10px;border-radius:3px}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-weight:700;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:#dde3e8;color:#1b2831;white-space:nowrap}
.chip.r{background:#f4c2ba}.chip.a{background:#f8e0a0}.chip.g{background:#bfe3cd}
.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:3px 14px;margin-top:8px;font-size:14px}.kv span{color:var(--mut)}.kv b{font-weight:600}
.ca{display:flex;gap:8px;margin-top:10px}.ca button{padding:6px 14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:3px;cursor:pointer;font:inherit;font-size:13px}.ca .x2{color:var(--bad);border-color:var(--bad);background:none}
.el{display:block;font-size:12px;color:var(--mut);margin-top:8px}.el input,.el select{width:100%;padding:8px;font:inherit;border:1px solid var(--ln);border-radius:3px;color:var(--ink);background:#fff;margin-top:2px}
details.p summary{font-weight:700;cursor:pointer;color:var(--ac)}
.rl{padding:7px 2px;border-bottom:1px solid var(--ln);font-size:14px}.rl:first-of-type{font-weight:600}
.ph{display:none;font-weight:700;margin-bottom:10px}
@media print{header,nav,.noprint,.bar2,details,.ca,.tabs{display:none!important}body{background:#fff}main{padding:0}.card,.p{break-inside:avoid;border:1px solid #888}.ph{display:block!important}}
</style></head><body>
<header><h1>Steadyfix CMMS</h1><select id="site"></select><a href="maintdesk_login.html">Team &amp; sites</a></header>
<nav id="nav"></nav><main id="v">Loading…</main>
<script>
const SUPABASE_URL='https://wqggnimaglsikdusbvuh.supabase.co', SUPABASE_ANON_KEY='sb_publishable_NhiAgVZ451DMdfwzWTSGvQ_zQlbwW8l';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), V=$('v');
let me,site,cur='dash',cf='daily';
const F=(k,l,t,o)=>({k,l,t,o});
const st=['open','in_progress','on_hold','done','cancelled'], PR=['low','medium','high','urgent'];
const ASSET=F('asset_id','Asset','r',['assets','name']), STAFF=k=>F(k,'Assigned to','r',['profiles','full_name']);
const MOD={
 work_orders:{l:'Work tasks',s:1,f:[F('title','Task','t'),ASSET,STAFF('assigned_to'),F('priority','Priority','s',PR),F('due_date','Due','d'),F('status','Status','s',st)]},
 pm_schedules:{l:'PM schedules',s:1,f:[F('title','PM task','t'),ASSET,STAFF('assigned_to'),F('frequency_days','Every (days)','n'),F('next_due','Next due','d')]},
 stock_items:{l:'Stock',f:[F('name','Item','t'),F('sku','SKU','t'),F('unit_cost','Unit cost','n'),F('min_level','Min level','n'),F('on_hand','On hand (this site)','n',0,1)]},
 purchase_orders:{l:'Orders',s:1,f:[F('po_number','PO number','t'),F('supplier_id','Supplier','r',['suppliers','name']),F('total_cost','Cost','n'),F('expected_at','Expected','d'),F('status','Status','s',['draft','ordered','delivered','cancelled'])]},
 shutdowns:{l:'Shutdowns',s:1,f:[F('title','Shutdown','t'),F('system','System','t'),F('starts_at','Starts','dt'),F('duration_hrs','Hours','n'),F('status','Status','s',['planned','notified','active','complete'])]},
 sensors:{l:'Monitoring',s:1,note:'Register each meter or sensor here. Live readings arrive from your WiFi devices using each sensor\u2019s device key. That feed is the next build step.',f:[F('name','Sensor','t'),F('kind','Type','s',['electricity','water','gas','temperature','pressure','current','flow']),F('unit','Unit','t'),F('alert_min','Alert below','n'),F('alert_max','Alert above','n')]},
 assets:{l:'Wear & life',s:1,f:[F('name','Asset','t'),F('category','Category','t'),F('installed_on','Installed','d'),F('life_years','Life (yrs)','n'),F('wear_pct','Wear %','n'),F('replace_cost','Replace cost','n'),F('status','Status','s',['running','faulty','stopped','retired'])]},
 shifts:{l:'Rosters',s:1,f:[STAFF('user_id'),F('shift_date','Date','d'),F('shift_type','Shift','s',['day','night','standby','off','leave'])]},
 budgets:{l:'Budget',s:1,m:1,f:[F('category','Category','t'),F('year','Year','n'),F('annual_amount','Annual budget','n')]},
 expenses:{l:'Expenses',s:1,m:1,f:[F('category','Category','t'),F('amount','Amount','n'),F('spent_on','Date','d')]},
 suppliers:{l:'Suppliers',f:[F('name','Name','t'),F('kind','Type','s',['supplier','subcontractor']),F('trade','Trade','t'),F('phone','Phone','t'),F('rating','Rating (1-5)','n')]},
 vehicles:{l:'Fleet',s:1,f:[F('name','Vehicle','t'),F('reg_no','Reg','t'),F('odometer_km','Odometer km','n'),F('next_service_km','Next service km','n'),F('status','Status','s',['available','in_use','in_service'])]}};
const TABS=[['dash','Dashboard'],['rep','Reports'],['work_orders'],['pm_schedules'],['chk','Checklists'],['stock_items'],['purchase_orders'],['shutdowns'],['sensors'],['assets'],['shifts'],['budgets'],['expenses'],['suppliers'],['vehicles'],['sub','Subscribe']];
const isMgr=()=>['owner','manager'].includes(me.role);
const yr=new Date().getFullYear(), today=new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const R=n=>'R '+Math.round(n||0).toLocaleString('en-ZA');

async function boot(){
 const{data:{session}}=await sb.auth.getSession(); if(!session)return location.href='maintdesk_login.html';
 const{data}=await sb.from('profiles').select('id,company_id,full_name,role').eq('id',session.user.id).maybeSingle();
 if(!data)return location.href='maintdesk_login.html'; me=data;
 const{data:sites}=await sb.from('sites').select('id,name').order('name'); site=sites[0]?.id;
 $('site').innerHTML=sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
 $('site').onchange=e=>{site=e.target.value;draw()};
 $('nav').innerHTML=TABS.filter(t=>isMgr()||!['budgets','expenses','sub'].includes(t[0])).map(t=>`<button data-t="${t[0]}">${t[1]||MOD[t[0]].l}</button>`).join('');
 $('nav').onclick=e=>{if(e.target.dataset.t){cur=e.target.dataset.t;draw()}};
 draw()}

async function draw(){[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t==cur));V.innerHTML='Loading…';
 try{V.innerHTML=cur=='dash'?await dash():cur=='rep'?await rep():cur=='chk'?await chk():cur=='sub'?await sub():await mod(cur);if(cur=='sub')pay()}catch(e){V.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}}

async function dash(){
 const w=await sb.from('work_orders').select('title,priority,due_date,status').eq('site_id',site).not('status','in','(done,cancelled)').order('due_date');
 const pm=await sb.from('pm_schedules').select('title,next_due').eq('site_id',site).eq('active',true).lt('next_due',today);
 const it=await sb.from('stock_items').select('id,name,min_level'), lv=await sb.from('stock_levels').select('item_id,on_hand').eq('site_id',site);
 const oh=Object.fromEntries((lv.data||[]).map(l=>[l.item_id,+l.on_hand])), low=(it.data||[]).filter(i=>(oh[i.id]||0)<i.min_level);
 const as=await sb.from('assets').select('name,wear_pct').eq('site_id',site).gte('wear_pct',75);
 const urg=(w.data||[]).filter(x=>x.priority=='urgent');
 SHARE={title:'Today at a glance - '+SH(),text:'Today at a glance\n'+SH()+'\nOpen work tasks: '+w.data.length+'\nOverdue PMs: '+pm.data.length+'\nBelow min stock: '+low.length+'\nAssets 75%+ worn: '+as.data.length+'\n\nNeeds attention:\n'+[...urg.map(x=>'- '+x.title+' (due '+(x.due_date||'no date')+')'),...pm.data.map(x=>'- PM overdue: '+x.title),...low.map(x=>'- Reorder '+x.name),...as.data.map(x=>'- '+x.name+' '+x.wear_pct+'% worn')].join('\n')};
 return`${ph('Today at a glance')}<h2>Today at a glance</h2>${bar()}<div class="g"><div class="k"><b>${w.data.length}</b><span>Open work tasks</span></div><div class="k"><b class="bad">${pm.data.length}</b><span>Overdue PMs</span></div><div class="k"><b>${low.length}</b><span>Below min stock</span></div><div class="k"><b>${as.data.length}</b><span>Assets 75%+ worn</span></div></div>
 <div class="p"><b>Needs attention</b>${urg.map(x=>`<div class="chk">🔧 ${esc(x.title)} (due ${x.due_date||'no date'})</div>`).join('')}${pm.data.map(x=>`<div class="chk">⏰ ${esc(x.title)} overdue since ${x.next_due}</div>`).join('')}${low.map(x=>`<div class="chk">📦 Reorder ${esc(x.name)}: ${oh[x.id]||0} on hand, min ${x.min_level}</div>`).join('')}${as.data.map(x=>`<div class="chk">⚙️ ${esc(x.name)} is ${x.wear_pct}% worn</div>`).join('')||''}</div>`}

const SH=()=>$('site').selectedOptions[0]?.textContent||'';
let SHARE={title:'',text:''},rp='daily';
const bar=()=>`<div class="bar2 noprint"><button onclick="doPrint()">🖨 Print</button><button onclick="doMail()">✉ Email</button><button onclick="doShare()">↗ Share</button></div>`;
const ph=t=>`<div class="ph">Steadyfix CMMS · ${esc(SH())} · ${new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})}<br>${esc(t)}</div>`;
function doPrint(){window.print()}
function doMail(){const t=SHARE.text,cut=t.length>1700;location.href='mailto:?subject='+encodeURIComponent(SHARE.title)+'&body='+encodeURIComponent(cut?t.slice(0,1700)+'\n...(shortened. Use Share or Print for the full report)':t)}
async function doShare(){if(navigator.share){try{await navigator.share({title:SHARE.title,text:SHARE.text})}catch(e){}}else{try{await navigator.clipboard.writeText(SHARE.text);alert('Copied. Paste it into WhatsApp, an email or a message.')}catch(e){prompt('Copy this text:',SHARE.text)}}}
const cap=s=>String(s??'').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const dd=s=>s?new Date(String(s).length>10?s:s+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'-';
const chip=(v,l)=>{const x=String(v),c=['urgent','faulty','cancelled','stopped','overdue','past_due'].includes(x)?'r':['high','on_hold','in_service','active'].includes(x)?'a':['done','complete','delivered','running','available','low'].includes(x)?'g':'';return`<span class="chip ${c}">${esc(l)}</span>`};
const MONEY=/cost|amount|budget/i;
function show(f,v,refs){if(v===null||v===undefined||v==='')return'-';
 if(f.t=='r')return(refs[f.o[0]].find(r=>r.id==v)||{})[f.o[1]]||'-';
 if(f.t=='s')return cap(v);if(f.t=='d')return dd(v);
 if(f.t=='dt')return new Date(v).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 if(f.t=='n')return MONEY.test(f.k)?R(v):f.k=='wear_pct'?v+'%':String(v);return String(v)}
function tg(r){const c=$('c'+r),e=c.querySelector('.ed');if(e.style.display!='none')return draw();e.style.display='block';c.querySelector('.vw').style.display='none';c.querySelector('.ca button').textContent='Done'}

async function mod(id){
 const m=MOD[id], refs={};
 for(const f of m.f)if(f.t=='r'&&!refs[f.o[0]]){let q=sb.from(f.o[0]).select('id,'+f.o[1]).order(f.o[1]);if(f.o[0]=='assets')q=q.eq('site_id',site);refs[f.o[0]]=(await q).data||[]}
 let q=sb.from(id).select('*').order(m.f[0].k);if(m.s)q=q.eq('site_id',site);const{data:rows,error}=await q;if(error)throw error;
 let oh={};if(id=='stock_items')(await sb.from('stock_levels').select('item_id,on_hand').eq('site_id',site)).data.forEach(l=>oh[l.item_id]=l.on_hand);
 let pre=m.note?`<div class="note">${m.note}</div>`:'',sumTxt='';
 if(id=='budgets'){const ex=(await sb.from('expenses').select('category,amount,spent_on').eq('site_id',site).gte('spent_on',yr+'-01-01')).data||[],mo=new Date().getMonth()+1;
  const sp={};ex.forEach(e=>sp[e.category]=(sp[e.category]||0)+ +e.amount);const cur_=rows.filter(r=>r.year==yr);
  sumTxt='Budget '+yr+' summary\n'+cur_.map(r=>{const s=sp[r.category]||0,p=s/mo*12;return'- '+r.category+': budget '+R(r.annual_amount)+', spent '+R(s)+', projected '+R(p)+(p>r.annual_amount?' (over)':'')}).join('\n')+'\n\n';
  pre=`<div class="p"><b>Budget ${yr}: spent so far and projection</b>${cur_.map(r=>{const s=sp[r.category]||0,p=s/mo*12;return`<div class="rl">${esc(r.category)}: ${R(s)} of ${R(r.annual_amount)} (${Math.round(s/r.annual_amount*100||0)}%) · projected <span class="${p>r.annual_amount?'bad':''}">${R(p)}${p>r.annual_amount?' (over)':''}</span></div>`}).join('')||'<div class="rl">No budget lines for this year yet.</div>'}</div>`}
 const cell=(f,v,rid)=>{const oc=`onchange="upd('${id}','${rid}','${f.k}','${f.t}',this.value,${f.v?1:0})"`;
  if(f.t=='s')return`<select ${oc}>${f.o.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.t=='r')return`<select ${oc}><option value="">-</option>${refs[f.o[0]].map(r=>`<option value="${r.id}" ${r.id==v?'selected':''}>${esc(r[f.o[1]])}</option>`).join('')}</select>`;
  return`<input ${oc} type="${{n:'number',d:'date',dt:'datetime-local'}[f.t]||'text'}" value="${esc(f.t=='dt'&&v?v.slice(0,16):v)}">`};
 const ty=f=>({n:'number',d:'date',dt:'datetime-local'}[f.t]||'text');
 const add=`<details class="p noprint"><summary>＋ Add new</summary><div class="f" style="margin-top:10px">${m.f.map((f,i)=>f.t=='s'?`<select id="n${i}">${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:f.t=='r'?`<select id="n${i}"><option value="">${f.l}</option>${refs[f.o[0]].map(r=>`<option value="${r.id}">${esc(r[f.o[1]])}</option>`).join('')}</select>`:`<input id="n${i}" placeholder="${f.l}" ${f.k=='year'?`value="${yr}"`:''} type="${ty(f)}">`).join('')}<button onclick="ins('${id}')">Add</button></div></details>`;
 const V_=rows.map(r=>m.f.map(f=>f.v?(oh[r.id]??0):r[f.k]));
 const txt=rows.map((r,i)=>{const L=m.f.map((f,j)=>({f,s:show(f,V_[i][j],refs)}));return(i+1)+'. '+L[0].s+(id=='stock_items'&&(oh[r.id]||0)<r.min_level?' (REORDER)':'')+'\n'+L.slice(1).filter(x=>x.s!='-').map(x=>'   '+x.f.l+': '+x.s).join('\n')}).join('\n\n');
 SHARE={title:m.l+' - '+SH(),text:m.l+'\n'+SH()+' · '+dd(today)+'\n\n'+sumTxt+(txt||'Nothing recorded yet.')};
 const cards=rows.map((r,i)=>{const v=V_[i],title=show(m.f[0],v[0],refs);
  const chips=m.f.map((f,j)=>f.t=='s'&&v[j]?chip(v[j],cap(v[j])):'').join('')+(id=='stock_items'?((oh[r.id]||0)<r.min_level?chip('overdue','Reorder'):chip('done','OK')):'');
  const kv=m.f.map((f,j)=>j==0||f.t=='s'?'':`<span>${f.l}</span><b>${esc(show(f,v[j],refs))}</b>`).join('');
  const ed=m.f.map((f,j)=>`<label class="el">${f.l}${cell(f,v[j],r.id)}</label>`).join('');
  return`<div class="card" id="c${r.id}"><div class="vw"><div class="ct"><div>${esc(title)}</div><div class="chips">${chips}</div></div><div class="kv">${kv}</div></div><div class="ed" style="display:none">${ed}</div><div class="ca noprint"><button onclick="tg('${r.id}')">Edit</button>${isMgr()?`<button class="x2" onclick="del('${id}','${r.id}')">Delete</button>`:''}</div></div>`}).join('')||'<div class="p">Nothing here yet. Tap “Add new” to create the first one.</div>';
 return`${ph(m.l)}<h2>${m.l}</h2>${bar()}${pre}${add}${cards}`}

async function rep(){
 const d0=new Date(),iso=d=>d.toISOString().slice(0,10);let start=today,label='Daily report · '+dd(today);
 if(rp=='weekly'){const x=new Date(d0);x.setDate(x.getDate()-6);start=iso(x);label='Weekly report · '+dd(start)+' to '+dd(today)}
 if(rp=='monthly'){start=today.slice(0,8)+'01';label='Monthly report · '+d0.toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}
 const q=(t,c)=>sb.from(t).select(c).eq('site_id',site);
 const [wo,pm,tp,rn,it,lv,po,sd,as,vh,ex]=await Promise.all([q('work_orders','title,priority,status,due_date,created_at,completed_at'),q('pm_schedules','title,next_due').eq('active',true),q('checklist_templates','id,name,items'),q('checklist_runs','template_id,run_date,results').gte('run_date',start),sb.from('stock_items').select('id,name,min_level'),q('stock_levels','item_id,on_hand'),q('purchase_orders','po_number,status,total_cost,ordered_at,expected_at'),q('shutdowns','title,system,starts_at,status'),q('assets','name,wear_pct'),q('vehicles','name,odometer_km,next_service_km'),isMgr()?q('expenses','category,amount,spent_on').gte('spent_on',start):Promise.resolve({data:[]})]);
 const inP=x=>x&&String(x).slice(0,10)>=start,none=l=>l.length?l:['Nothing to report.'],S=[];
 const W=wo.data||[],op=x=>!['done','cancelled'].includes(x.status),od=W.filter(x=>op(x)&&x.due_date&&x.due_date<today),dn=W.filter(x=>inP(x.completed_at));
 S.push(['Work tasks',[`Opened: ${W.filter(x=>inP(x.created_at)).length} · Completed: ${dn.length} · Still open: ${W.filter(op).length} · Overdue: ${od.length}`,...dn.map(x=>'Done: '+x.title),...od.map(x=>`Overdue: ${x.title} (due ${dd(x.due_date)}, ${cap(x.priority)} priority)`)]]);
 const pmo=(pm.data||[]).filter(x=>x.next_due<today);S.push(['Preventive maintenance',[`Overdue: ${pmo.length}`,...pmo.map(x=>`${x.title}, due ${dd(x.next_due)}`)]]);
 const T=tp.data||[];S.push(['Checklists',none((rn.data||[]).map(r=>{const t=T.find(x=>x.id==r.template_id);return t?`${t.name} (${dd(r.run_date)}): ${Object.values(r.results||{}).filter(Boolean).length} of ${t.items.length} done`:null}).filter(Boolean))]);
 const oh=Object.fromEntries((lv.data||[]).map(l=>[l.item_id,+l.on_hand]));S.push(['Stock to reorder',none((it.data||[]).filter(i=>(oh[i.id]||0)<i.min_level).map(i=>`${i.name}: ${oh[i.id]||0} on hand, minimum ${i.min_level}`))]);
 const P=po.data||[],ord=P.filter(x=>inP(x.ordered_at)),out=P.filter(x=>x.status=='ordered');S.push(['Orders',[`Ordered in this period: ${ord.length} (${R(ord.reduce((a,x)=>a+ +x.total_cost,0))}) · Outstanding: ${out.length}`,...out.map(x=>`${x.po_number}: expected ${dd(x.expected_at)}`)]]);
 S.push(['Shutdowns',none((sd.data||[]).filter(x=>inP(x.starts_at)).map(x=>`${x.title} (${x.system||'system'}), ${dd(x.starts_at)}, ${cap(x.status)}`))]);
 S.push(['Assets 75% or more worn',none((as.data||[]).filter(x=>x.wear_pct>=75).map(x=>`${x.name}: ${x.wear_pct}% worn`))]);
 S.push(['Fleet due for service',none((vh.data||[]).filter(x=>x.next_service_km&&x.odometer_km>=x.next_service_km).map(x=>`${x.name}: ${x.odometer_km} km (service due at ${x.next_service_km} km)`))]);
 if(isMgr()){const E=ex.data||[],by={};E.forEach(e=>by[e.category]=(by[e.category]||0)+ +e.amount);S.push(['Spending',[`Total this period: ${R(E.reduce((a,e)=>a+ +e.amount,0))}`,...Object.entries(by).map(([c,a])=>`${c}: ${R(a)}`)]])}
 SHARE={title:label+' - '+SH(),text:label+'\n'+SH()+'\n\n'+S.map(([h,l])=>h.toUpperCase()+'\n'+l.map(x=>'- '+x).join('\n')).join('\n\n')};
 return`${ph(label)}<h2>Reports</h2><div class="tabs noprint">${['daily','weekly','monthly'].map(c=>`<button class="${c==rp?'on':''}" onclick="rp='${c}';draw()">${cap(c)}</button>`).join('')}</div><div class="note">${label} · ${esc(SH())}</div>${bar()}${S.map(([h,l])=>`<div class="p"><b>${h}</b>${l.map(x=>`<div class="rl">${esc(x)}</div>`).join('')}</div>`).join('')}`}

const val=(t,v)=>v===''?null:t=='n'?+v:t=='dt'?new Date(v).toISOString():v;
async function upd(tb,rid,k,t,v,virt){const r=virt?await sb.from('stock_levels').upsert({item_id:rid,site_id:site,company_id:me.company_id,on_hand:+v}):await sb.from(tb).update({[k]:val(t,v)}).eq('id',rid);if(r.error)alert(r.error.message);else if(tb=='stock_items')draw()}
async function ins(id){const m=MOD[id],row={company_id:me.company_id};if(m.s)row.site_id=site;let oh=0;
 m.f.forEach((f,i)=>{const v=val(f.t,$('n'+i).value);if(f.v)oh=v||0;else if(v!==null)row[f.k]=v});
 const{data,error}=await sb.from(id).insert(row).select('id').single();if(error)return alert(error.message);
 if(id=='stock_items')await sb.from('stock_levels').upsert({item_id:data.id,site_id:site,company_id:me.company_id,on_hand:oh});draw()}
async function del(tb,rid){if(!confirm('Delete this row?'))return;const{error}=await sb.from(tb).delete().eq('id',rid);error?alert(error.message):draw()}

const STARTER={daily:['Walk-round: leaks, noises, alarms','Pool plant pressure & chlorine','Generator fuel & battery','Geyser valves','Log meter readings'],weekly:['Test emergency lighting','Grease pumps & motors','Inspect gas connections','Clean strainers & filters','Fleet tyre & oil check'],monthly:['Thermal scan DB boards','Test generator on load','Service booster pumps','Review stock vs min levels','Review overdue PMs']};
function pkey(f){const d=new Date();if(f=='weekly'){d.setDate(d.getDate()-((d.getDay()+6)%7))}if(f=='monthly')d.setDate(1);return f=='daily'?today:d.toISOString().slice(0,10)}
async function chk(){
 const tp=(await sb.from('checklist_templates').select('*').eq('site_id',site)).data;
 if(!tp.length)return`<h2>Checklists</h2><div class="p">No checklists for this site yet.<br><br><button class="b" onclick="seed()">Add daily, weekly and monthly starter lists</button></div>`;
 const keys=['daily','weekly','monthly'].map(pkey), rn=(await sb.from('checklist_runs').select('*').eq('site_id',site).in('run_date',keys)).data;
 const t=tp.find(x=>x.frequency==cf)||tp[0], key=pkey(t.frequency), run=rn.find(r=>r.template_id==t.id&&r.run_date==key), res=run?.results||{};
 SHARE={title:cap(t.frequency)+' checklist - '+SH(),text:cap(t.frequency)+' checklist\n'+SH()+' · '+dd(key)+'\n\n'+t.items.map((x,i)=>(res[i]?'[x] ':'[ ] ')+x).join('\n')};
 return`${ph(cap(t.frequency)+' checklist')}<h2>Checklists</h2>${bar()}<div class="tabs">${['daily','weekly','monthly'].map(c=>`<button class="${c==t.frequency?'on':''}" onclick="cf='${c}';draw()">${c}</button>`).join('')}</div><div class="p">${t.items.map((x,i)=>`<label class="chk"><input type="checkbox" ${res[i]?'checked':''} onchange="tick('${t.id}','${key}',${i},this.checked)"><span class="${res[i]?'done':''}">${esc(x)}</span></label>`).join('')}</div><div class="note">Lists reset each day, week or month.</div>`}
async function seed(){await sb.from('checklist_templates').insert(Object.entries(STARTER).map(([f,items])=>({company_id:me.company_id,site_id:site,name:f+' checks',frequency:f,items})));draw()}
async function tick(tid,key,i,on){const{data}=await sb.from('checklist_runs').select('results').eq('template_id',tid).eq('run_date',key).maybeSingle();
 const results={...(data?.results||{}),[i]:on};await sb.from('checklist_runs').upsert({company_id:me.company_id,site_id:site,template_id:tid,run_date:key,results,completed_by:me.id,completed_at:new Date().toISOString()},{onConflict:'template_id,run_date'});draw()}
const PP_ID='BAAshiyibCQ9kJ0LRlICmsarQCMDDn_-hw-C21GIh3S077ex8wwvq_cTdKrUEV2Mqe9unUk5O5xLOICTas';
const PLANS=[['P-3GX3005824536144DNLAQLII','Steadyfix CMMS monthly subscription: $75 USD per month']];
async function sub(){const Q=()=>sb.from('companies').select('name,plan,subscription_status,max_sites,trial_ends_at').eq('id',me.company_id).single();let{data:c}=await Q();if(c.subscription_status=='pending'){try{await sb.functions.invoke('paypal-webhook',{body:{action:'sync'}})}catch(e){}c=(await Q()).data}const act=c.subscription_status=='active',pen=c.subscription_status=='pending';
 return`<h2>Subscription</h2><div class="p"><b>${esc(c.name)}</b><br>Plan: ${esc(c.plan)} · Status: <b class="${act?'':'bad'}">${esc(c.subscription_status)}</b> · Sites allowed: ${c.max_sites}${act||pen||!c.trial_ends_at?'':`<br>Trial ends ${new Date(c.trial_ends_at).toLocaleDateString('en-ZA')}`}${pen?'<br>Payment received. We are confirming it and will activate your plan shortly.':''}</div>`+(act?'':`<div class="note">${pen?'Payment not completed? You can try again below. ':''}Pay securely with PayPal. Your plan is activated as soon as PayPal confirms your payment.</div>`+PLANS.map(p=>`<div class="p"><b>${p[1]}</b><div id="pp-${p[0]}"></div></div>`).join(''))}
function pay(){if(!document.getElementById('pp-'+PLANS[0][0]))return;
 const go=()=>PLANS.forEach(([id])=>paypal.Buttons({style:{shape:'rect',color:'gold',layout:'vertical',label:'subscribe'},createSubscription:(d,a)=>a.subscription.create({plan_id:id,custom_id:me.company_id}),onApprove:async d=>{const{error}=await sb.rpc('record_subscription',{p_sub:d.subscriptionID});alert(error?'Payment received but not recorded ('+error.message+'). Reference: '+d.subscriptionID:'Thank you! Your subscription is being activated.');draw()}}).render('#pp-'+id));
 if(window.paypal&&paypal.Buttons)return go();const t=document.createElement('script');t.src='https://www.paypal.com/sdk/js?client-id='+PP_ID+'&vault=true&intent=subscription';t.setAttribute('data-sdk-integration-source','button-factory');t.onload=go;document.head.appendChild(t)}
boot();
