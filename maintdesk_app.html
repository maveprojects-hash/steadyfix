const r2=n=>Math.round((+n||0)*100)/100;
const nl=s=>esc(s||'').replace(/\n/g,'<br>');
const LIC={};
const liRow=l=>`<div class="lrow2 card" style="margin-top:8px"><label class="el">Description<input class="ld" value="${esc(l.d)}" placeholder="Item or description"></label><div class="f"><label class="el" style="flex:1">Qty<input class="lq" type="number" step="any" value="${l.q}"></label><label class="el" style="flex:1">Unit price<input class="lp" type="number" step="0.01" value="${l.p}"></label></div><div class="ct"><div class="lt">${M2(l.q*l.p)}</div><button type="button" class="x" onclick="liDel(this)">✕ Remove</button></div></div>`;
const liSum=L=>r2(L.reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0));
function liBlock(cid,lines,cfg){if(cfg)LIC[cid]=cfg;lines=(lines&&lines.length)?lines:[{d:'',q:1,p:0}];return`<div class="li" id="${cid}" oninput="liCalc('${cid}')" onchange="liChg('${cid}')">${lines.map(liRow).join('')}<div class="ct liadd" style="margin-top:10px"><button type="button" class="b" onclick="liAdd('${cid}')">＋ Add item</button><b class="litot">${M2(liSum(lines))}</b></div></div>`}
function liRead(cid){return[...$(cid).querySelectorAll('.lrow2')].map(r=>({d:r.querySelector('.ld').value.trim(),q:+r.querySelector('.lq').value||0,p:+r.querySelector('.lp').value||0})).filter(l=>l.d)}
function liCalc(cid){const b=$(cid);let s=0;b.querySelectorAll('.lrow2').forEach(r=>{const t=(+r.querySelector('.lq').value||0)*(+r.querySelector('.lp').value||0);s+=t;r.querySelector('.lt').textContent=M2(t)});b.querySelector('.litot').textContent=M2(s)}
function liAdd(cid){$(cid).querySelector('.liadd').insertAdjacentHTML('beforebegin',liRow({d:'',q:1,p:0}))}
function liDel(btn){const row=btn.closest('.lrow2'),b=row.parentElement,cid=b.id;if(b.querySelectorAll('.lrow2').length>1)row.remove();else{row.querySelector('.ld').value='';row.querySelector('.lq').value=1;row.querySelector('.lp').value=0}liCalc(cid);liChg(cid)}
async function liChg(cid){const c=LIC[cid];if(!c)return;const L=liRead(cid),u={[c.k]:L};if(c.tot&&L.length)u[c.tot]=liSum(L);const{error}=await sb.from(c.tb).update(u).eq('id',c.rid);if(error)alert(/column|schema/i.test(error.message)?'Item lists need one more database step. Run the new SQL I sent, then reload this page.':error.message)}
const liView=(L,lbl)=>(L&&L.length)?`<div class="kv" style="margin-top:6px"><span>${esc(lbl)}</span><b></b>${L.map(l=>`<span>${esc(l.d)}</span><b>${l.q} × ${M2(l.p)} = ${M2(l.q*l.p)}</b>`).join('')}</div>`:'';
function liEdit(tb,rid,f,v){const cid='e'+rid+f.k;return`<div class="el">${f.l}${liBlock(cid,v,{tb,rid,k:f.k,tot:f.o&&f.o.tot})}</div>`}

// totals: per-line discount (x), overall discount, then VAT
const effP=(d,l)=>(+l.p||0)*(1-(+l.x||0)/100)*(1-(+d.discount_pct||0)/100);

function metaList(m,skipNum){const d=m.d,a=[];if(!skipNum)a.push(['Number',d.number]);a.push(['Reference',d.reference],['Date',d.issue_date?dd(d.issue_date):''],[m.dueLbl,d.due_date?dd(d.due_date):''],['Sales rep',d.sales_rep]);if(+d.discount_pct>0)a.push(['Overall discount',(+d.discount_pct)+'%']);return a.filter(x=>x[1])}

function tableHtml(m,mode){const vr=+m.d.vat_rate||0,hasD=m.L.some(l=>+l.x>0),cl=mode=='classic',ord=m.k=='order';
 const head=cl?['Description','Quantity','Unit price','Disc %',...(ord?[]:['VAT %']),'Excl. total',...(ord?[]:['Incl. total'])]:['Description','Qty','Unit price',...(hasD?['Disc %']:[]),'Amount'];

function ovl(html){let o=$('pv');if(o)o.remove();o=document.createElement('div');o.id='pv';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;overflow:auto;padding:10px';o.innerHTML=`<div style="max-width:800px;margin:0 auto"><button class="b" onclick="$('pv').remove()" style="position:sticky;top:0;margin-bottom:8px">Close preview</button><div style="background:#fff;overflow-x:auto">${html}</div></div>`;document.body.appendChild(o)}
function loadPdfLib(){return window.html2pdf?Promise.resolve():new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=ok;s.onerror=()=>bad(new Error('load'));document.head.appendChild(s)})}
async function shareHtml(html,fname,subject,text,to){let el;
 try{await loadPdfLib();el=document.createElement('div');el.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';el.innerHTML=html;document.body.appendChild(el);
  const blob=await html2pdf().set({margin:0,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).outputPdf('blob');el.remove();el=null;
  const file=new File([blob],fname.replace(/[^\w-]+/g,'_')+'.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:subject,text});return}catch(e){if(e&&e.name=='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  alert('The PDF was saved to your downloads. Your email app opens next. Attach the PDF to the email.');
  location.href='mailto:'+(to||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text)
 }catch(e){if(el)el.remove();alert('Could not make the PDF here. The print page opens next: choose Save as PDF.');sheetPrint(html)}}

function logoPick(inp){const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return alert('Please choose a picture (PNG or JPG).');const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));let x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>250000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}LOGO_NEW=u;$('lg_prev').innerHTML=`<img src="${u}" style="max-height:80px;max-width:200px"><div class="note">Tap Save at the bottom to keep it.</div>`};im.onerror=()=>alert('That picture could not be read. Try a PNG or JPG.');im.src=rd.result};rd.readAsDataURL(f)}

async function chk(){
 const all=(await sb.from('checklist_templates').select('*').eq('site_id',site).order('name')).data||[],list=all.filter(x=>x.frequency==cf),t=list.find(x=>x.id==ct)||list[0];

 const newf=`<details class="p noprint"><summary>＋ New ${cf} checklist</summary><div class="f" style="margin-top:10px"><input id="ncn" placeholder="Name, e.g. Kitchen opening check"><button onclick="newList()">Create</button></div></details>`;
 if(!t)return head+`<div class="p noprint">No ${cf} checklist yet. Create your own below${all.length?'.':', or add starter lists for every frequency.'}</div>${all.length?'':`<button class="b noprint" onclick="seed()">Add starter lists</button><br><br>`}${newf}`;
 ct=t.id;const key=pk(cf),run=(await sb.from('checklist_runs').select('results').eq('template_id',t.id).eq('run_date',key).maybeSingle()).data,res=run?.results||{},meta=res._meta||{},by=meta.by??me.full_name;

 const sel=list.length>1?`<div class="f noprint"><select onchange="ct=this.value;ced=false;draw()">${list.map(x=>`<option value="${x.id}" ${x.id==t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:'';
 const body=ced?`<div class="p noprint"><b>Edit this checklist</b><label class="el">List name<input value="${esc(t.name)}" onchange="renList('${t.id}',this.value)"></label>${t.items.map((x,i)=>`<div class="f" style="margin:8px 0 0"><input value="${esc(x)}" onchange="editTask('${t.id}',${i},this.value)"><button class="x" onclick="delTask('${t.id}',${i})">✕</button></div>`).join('')}<div class="f" style="margin-top:10px"><input id="nt" placeholder="New task"><button onclick="addTask('${t.id}')">Add task</button></div><button class="b" onclick="ced=false;draw()">Done editing</button> <button class="x2" style="padding:8px 12px;background:none;border:1px solid var(--bad);color:var(--bad);border-radius:3px;cursor:pointer" onclick="delList('${t.id}')">Delete this checklist</button></div>`
 :`<div class="p noprint">${t.items.map((x,i)=>`<label class="chk"><input type="checkbox" ${res[i]?'checked':''} onchange="tick('${t.id}','${key}',${i},this.checked)"><span class="${res[i]?'done':''}">${esc(x)}</span></label>`).join('')||'<div class="rl">No tasks yet. Tap Edit tasks to add some.</div>'}<div style="margin-top:8px"><b>${t.items.filter((x,i)=>res[i]).length} of ${t.items.length} done</b> · ${esc(t.name)} · ${dd(key)}</div></div>

 const sheet=`<div class="po"><br><p><b>${esc(t.name)}</b> · ${cap(cf)} checklist · ${dd(key)}</p><p>Checked by: ${esc(by||'______________________')}</p><table class="pt"><tr><th style="width:60px">Done</th><th>Task</th></tr>${t.items.map((x,i)=>`<tr><td>${res[i]?'☑':'☐'}</td><td>${esc(x)}</td></tr>`).join('')}</table><p><b>Notes or issues found:</b> ${meta.notes?esc(meta.notes):'<br><br>______________________________________________'}</p></div>${foot(by,meta.mgr,meta.date)}`;
